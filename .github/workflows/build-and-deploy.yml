name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/zachbellay/flask-scu-course-evals

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Import application
        env:
          APP_CONFIG: config.ProductionConfig
          PROD_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          PROD_GOOGLE_CLIENT_SECRET: ci-placeholder
          WHITELIST_ENABLED: "False"
        run: python -c 'from app import app; print(app.name)'

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  update-infra:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zachbellay/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - name: Update GitOps image
        env:
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("infra/gitops/projects/scu-course-evals/kustomization.yaml")
          text = path.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if "newTag:" in line:
                  lines[i] = f'    newTag: "{os.environ["SHA"]}"'
                  break
          path.write_text("\n".join(lines) + "\n")
          PY
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/projects/scu-course-evals/kustomization.yaml
          git diff --cached --quiet || git commit -m "Deploy SCU course evals ${SHA}"
          git push origin main
